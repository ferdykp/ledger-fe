# Tempel blok ini di dalam `server { ... }` virtual host frontend.
# Exact redirect harus tetap berada di atas static/catch-all location:
# /assets/ adalah folder bundle Vite, bukan lagi route halaman Ledger.
location = /assets {
    return 301 /investasi;
}

location = /assets/ {
    return 301 /investasi;
}

# File build tetap disajikan langsung; halaman Vue Router lainnya kembali ke SPA.
location / {
    try_files $uri /index.html;
}
